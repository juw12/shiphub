# Render Blueprint: push this folder to a GitHub repo, then
# Render dashboard -> New -> Blueprint -> pick the repo.
services:
  - type: web
    name: shiphub
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shiphub-db
          property: connectionString
      - key: SHIPHUB_DEMO
        value: "0"
      - key: TRUST_PROXY
        value: "1"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SHIPHUB_ADMINS
        sync: false

databases:
  - name: shiphub-db
    plan: free
    databaseName: shiphub
