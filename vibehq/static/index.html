<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeHQ - social HQ for vibe coders</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="vibeHQ">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png">
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel-2: #1b2130;
    --line: #262d3d;
    --text: #e7eaf1;
    --muted: #8b93a7;
    --accent: #7c5cff;
    --accent-2: #19d3a2;
    --warn: #ffb547;
    --bad: #ff5c7a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 Inter, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #1d1640 0%, transparent 60%), var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  a { color: var(--accent-2); }
  button, input, select, textarea {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
  }
  textarea { width: 100%; resize: vertical; min-height: 70px; }
  .stack > input, .stack > select { width: 100%; max-width: 100%; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { cursor: pointer; background: var(--panel-2); transition: .15s; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; }
  button.small { padding: 4px 10px; font-size: 12px; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .stack > * + * { margin-top: 12px; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 18px;
    padding: 12px 22px;
    background: rgba(11, 13, 18, .85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: -.5px; cursor: pointer; }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  nav button { background: transparent; border: none; color: var(--muted); position: relative; }
  nav button.active { color: var(--text); background: var(--panel-2); }
  .badge {
    position: absolute; top: 0; right: 0;
    background: var(--bad); color: white; border-radius: 99px;
    font-size: 10px; padding: 0 5px; line-height: 16px;
  }
  .me-chip { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .xpbar { width: 120px; height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
  .xpbar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  main { max-width: 1100px; margin: 22px auto; padding: 0 18px 80px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .grid-2 { display: grid; grid-template-columns: 320px 1fr; gap: 18px; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  h3 { margin: 0 0 8px; font-size: 15px; }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; color: white; flex-shrink: 0;
  }
  .avatar.lg { width: 72px; height: 72px; font-size: 28px; }
  .tier { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; font-weight: 600; }
  .tier.Bronze { color: #d08b5b; } .tier.Silver { color: #c0c8d8; } .tier.Gold { color: #ffd34d; }
  .tier.Platinum { color: #6fe3ff; } .tier.Diamond { color: #9b8cff; } .tier.Legend { color: #ff6fb1; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .kind.ship { background: #19d3a222; color: var(--accent-2); }
  .kind.tip { background: #7c5cff22; color: #a996ff; }
  .kind.news { background: #ffb54722; color: var(--warn); }
  .kind.post { background: #ffffff11; color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: white; }

  .post { display: flex; gap: 12px; }
  .post + .post { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .post .body { white-space: pre-wrap; word-break: break-word; margin: 4px 0 8px; }
  .name { font-weight: 600; cursor: pointer; }
  .name:hover { text-decoration: underline; }
  .like.on { color: var(--bad); border-color: var(--bad); }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.me-row { background: #7c5cff18; }
  .podium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: end; margin-bottom: 16px; }
  .podium .card { text-align: center; }
  .podium .p1 { padding-top: 30px; border-color: #ffd34d; }
  .medal { font-size: 26px; }

  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: #555; }
  .dot.on { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }
  .device { cursor: pointer; }
  .device.selected { border-color: var(--accent); }
  .agent-chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); }
  .agent-chip.live { border-color: var(--accent-2); color: var(--accent-2); }
  .status { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; }
  .status.queued { background: #ffffff11; color: var(--muted); }
  .status.running { background: #ffb54722; color: var(--warn); }
  .status.done { background: #19d3a222; color: var(--accent-2); }
  .status.failed { background: #ff5c7a22; color: var(--bad); }
  pre {
    background: #0a0c10; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; overflow: auto; max-height: 260px; font-size: 12px; white-space: pre-wrap; margin: 8px 0 0;
  }
  code.key { background: #0a0c10; padding: 8px 10px; border-radius: 8px; display: block; word-break: break-all; border: 1px dashed var(--accent); }

  .chat { display: grid; grid-template-columns: 240px 1fr; gap: 18px; height: calc(100vh - 140px); }
  .channels { overflow: auto; }
  .channel { padding: 8px 10px; border-radius: 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .channel:hover { background: var(--panel-2); }
  .channel.active { background: var(--accent); }
  .messages { display: flex; flex-direction: column; min-height: 0; }
  .message-list { flex: 1; overflow: auto; padding-right: 6px; }
  .msg { display: flex; gap: 10px; margin-bottom: 12px; }
  .msg .text { white-space: pre-wrap; word-break: break-word; }

  .product .price { font-size: 20px; font-weight: 800; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 22px; }

  #toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  .toast { background: var(--panel-2); border: 1px solid var(--accent); padding: 10px 14px; border-radius: 10px; animation: pop .2s; }
  @keyframes pop { from { transform: translateY(10px); opacity: 0; } }

  .auth { max-width: 420px; margin: 8vh auto; }
  .auth h1 { font-size: 34px; margin: 0; letter-spacing: -1px; }
  .hero-points { color: var(--muted); padding-left: 18px; }

  .bell { position: relative; background: transparent; border: none; font-size: 18px; padding: 6px 8px; }
  .notif-panel {
    position: fixed; top: 64px; right: 16px; width: 360px; max-width: calc(100vw - 32px);
    max-height: 70vh; overflow: auto; z-index: 40; box-shadow: 0 20px 50px #000a;
  }
  .notif { padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .notif.unread { background: #7c5cff14; }
  .verified { font-size: 11px; font-weight: 700; color: var(--accent-2); border: 1px solid var(--accent-2); border-radius: 6px; padding: 1px 6px; text-decoration: none; }
  .banner { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .banner.demo { background: #ffb54718; border: 1px solid #ffb54755; color: var(--warn); }
  .banner.live { background: #19d3a214; border: 1px solid #19d3a255; color: var(--accent-2); }
  .gh { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .gh img { width: 18px; height: 18px; border-radius: 50%; }
  button.github { background: #24292f; border-color: #57606a; color: white; font-weight: 600; }

  @media (max-width: 800px) {
    .grid-2, .chat { grid-template-columns: 1fr; }
    .chat { height: auto; }
    .xpbar, .me-chip > div, #logoutbtn { display: none; }
    header { padding: 10px 14px; backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      justify-content: space-around; flex-wrap: nowrap; gap: 0;
      background: rgba(11, 13, 18, .96); border-top: 1px solid var(--line);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    nav button { font-size: 12px; padding: 8px 6px; }
    main { padding-bottom: 110px; margin-top: 14px; }
    .podium { grid-template-columns: 1fr; }
    .grid-cards[style*="repeat(5"] { grid-template-columns: repeat(3, 1fr) !important; }
  }
</style>
</head>
<body>
<header id="topbar" hidden>
  <div class="logo" onclick="go('feed')">vibe<span>HQ</span></div>
  <nav id="nav"></nav>
  <button class="bell" onclick="toggleNotifications()" title="Notifications">🔔<span id="bellbadge"></span></button>
  <div class="me-chip" id="mechip" onclick="viewUser(state.me.username)"></div>
  <button class="ghost small" id="logoutbtn" onclick="logout()">Log out</button>
</header>
<div class="card notif-panel" id="notifpanel" hidden></div>
<main id="main"></main>
<div id="toasts"></div>

<script>
const state = {
  token: localStorage.getItem("vhq_token"),
  me: null,
  pendingFriends: 0,
  view: "feed",
  feedKind: "",
  feedScope: "all",
  ladderScope: "global",
  ladderPeriod: "all",
  marketKind: "",
  chatChannel: "world",
  unread: {},
  deviceId: null,
  devices: [],
  stream: null,
  config: { payments: "demo", github: false, fee_percent: 10 },
  unreadNotifications: 0,
  pendingAuthError: "",
};

const VIEWS = [
  ["feed", "Feed"],
  ["ladder", "Ladder"],
  ["agents", "Agents"],
  ["chat", "Chat"],
  ["market", "Market"],
  ["friends", "Friends"],
];

// ------------------------------------------------------------ utilities

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

function flag(country) {
  if (!country || country.length !== 2) {
    return "🌍";
  }
  return String.fromCodePoint(...[...country.toUpperCase()].map(ch => 0x1f1e6 + ch.charCodeAt(0) - 65));
}

function ago(seconds) {
  const diff = Math.max(0, Date.now() / 1000 - seconds);
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
}

function money(cents) {
  return cents === 0 ? "Free" : "$" + (cents / 100).toFixed(2);
}

function avatar(name, size = "") {
  let hash = 0;
  for (const ch of name) {
    hash = (hash * 31 + ch.charCodeAt(0)) % 360;
  }
  return `<span class="avatar ${size}" style="background:hsl(${hash} 65% 45%)">${esc(name[0].toUpperCase())}</span>`;
}

function tierBadge(tier) {
  return `<span class="tier ${esc(tier)}">${esc(tier)}</span>`;
}

function userLink(name) {
  return `<span class="name" onclick="viewUser('${esc(name)}')">${esc(name)}</span>`;
}

function toast(text) {
  const element = document.createElement("div");
  element.className = "toast";
  element.textContent = text;
  document.getElementById("toasts").appendChild(element);
  setTimeout(() => element.remove(), 4000);
}

async function api(path, body) {
  const options = { method: body === undefined ? "GET" : "POST", headers: { "Content-Type": "application/json" } };
  if (state.token) {
    options.headers.Authorization = "Bearer " + state.token;
  }
  if (body !== undefined) {
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (response.status === 401 && state.token) {
    logout();
  }
  if (!response.ok) {
    throw new Error(data.error || response.statusText);
  }
  return data;
}

async function attempt(action) {
  try {
    return await action();
  } catch (error) {
    toast("⚠ " + error.message);
  }
}

const main = () => document.getElementById("main");

// ------------------------------------------------------------ auth

function renderAuth(mode = "login") {
  document.getElementById("topbar").hidden = true;
  main().innerHTML = `
    <div class="auth stack">
      <h1>vibe<span style="color:var(--accent)">HQ</span></h1>
      <p class="muted">The social HQ for vibe coders worldwide.</p>
      <ul class="hero-points">
        <li>Monitor & command your own devices and AI coding agents</li>
        <li>Share ships, tips and news - climb the global ladder</li>
        <li>Add friends, chat with builders in every timezone</li>
        <li>Sell templates, prompts, agents and apps</li>
      </ul>
      <div class="card stack">
        <input id="au" placeholder="username" autocomplete="username">
        <input id="ap" placeholder="password (8+ chars)" type="password" autocomplete="current-password">
        ${mode === "register" ? `<input id="ac" placeholder="country code, e.g. ID, US, BR" maxlength="2">` : ""}
        <button class="primary" onclick="submitAuth('${mode}')">${mode === "login" ? "Log in" : "Create account"}</button>
        ${state.config.github ? `<button class="github" onclick="location.href='/api/auth/github/start'">Continue with GitHub</button>` : ""}
        ${state.pendingAuthError ? `<p style="color:var(--bad);margin:0">⚠ ${esc(state.pendingAuthError)}</p>` : ""}
        <p class="muted" style="margin:0">
          ${mode === "login"
            ? `New here? <a href="#" onclick="renderAuth('register')">Create an account</a>`
            : `Have an account? <a href="#" onclick="renderAuth('login')">Log in</a>`}
        </p>
      </div>
    </div>`;
  document.getElementById("ap").addEventListener("keydown", event => {
    if (event.key === "Enter") submitAuth(mode);
  });
}

async function submitAuth(mode) {
  const body = {
    username: document.getElementById("au").value.trim(),
    password: document.getElementById("ap").value,
  };
  if (mode === "register") {
    body.country = document.getElementById("ac").value.trim();
  }
  const result = await attempt(() => api("/api/" + mode, body));
  if (result) {
    setToken(result.token);
    boot();
  }
}

// The service worker can't read localStorage, so the token is mirrored into IndexedDB
// for fetching notification text when a push arrives.
function workerStore(token) {
  return new Promise(resolve => {
    if (!("indexedDB" in window)) return resolve();
    const open = indexedDB.open("vibehq", 1);
    open.onupgradeneeded = () => open.result.createObjectStore("kv");
    open.onerror = () => resolve();
    open.onsuccess = () => {
      const store = open.result.transaction("kv", "readwrite").objectStore("kv");
      const request = token ? store.put(token, "token") : store.delete("token");
      request.onsuccess = () => resolve();
      request.onerror = () => resolve();
    };
  });
}

function setToken(token) {
  state.token = token;
  if (token) {
    localStorage.setItem("vhq_token", token);
  } else {
    localStorage.removeItem("vhq_token");
  }
  workerStore(token);
}

async function logout() {
  if (state.token) {
    const subscription = await currentPushSubscription();
    if (subscription) {
      await api("/api/push/unsubscribe", { endpoint: subscription.endpoint }).catch(() => {});
    }
    fetch("/api/logout", { method: "POST", headers: { Authorization: "Bearer " + state.token } });
  }
  setToken(null);
  if (state.stream) {
    state.stream.close();
  }
  renderAuth();
}

// ------------------------------------------------------------ shell

async function refreshMe() {
  const data = await api("/api/me");
  state.me = data.user;
  state.pendingFriends = data.pending_friend_requests;
  state.unreadNotifications = data.unread_notifications;
  renderBell();
  const me = state.me;
  const span = me.next_tier_xp ? me.next_tier_xp - me.tier_floor : 1;
  const progress = me.next_tier_xp ? ((me.xp - me.tier_floor) / span) * 100 : 100;
  document.getElementById("mechip").innerHTML = `
    <div style="text-align:right">
      <div><b>${esc(me.username)}</b> ${tierBadge(me.tier)}</div>
      <div class="muted" style="font-size:11px">Lv ${me.level} · ${me.xp} XP${me.next_tier ? ` · ${me.next_tier_xp - me.xp} to ${esc(me.next_tier)}` : ""}</div>
      <div class="xpbar"><div style="width:${progress}%"></div></div>
    </div>
    ${avatar(me.username)}`;
  renderNav();
}

function renderNav() {
  const unreadTotal = Object.values(state.unread).reduce((a, b) => a + b, 0);
  document.getElementById("nav").innerHTML = VIEWS.map(([id, label]) => {
    let badge = "";
    if (id === "chat" && unreadTotal) badge = `<span class="badge">${unreadTotal}</span>`;
    if (id === "friends" && state.pendingFriends) badge = `<span class="badge">${state.pendingFriends}</span>`;
    return `<button class="${state.view === id ? "active" : ""}" onclick="go('${id}')">${label}${badge}</button>`;
  }).join("");
}

function go(view) {
  view = /^[a-z]+(:[A-Za-z0-9_]+)?$/.test(view || "") ? view : "feed";
  if (view === "profile") {
    return viewUser(state.me.username);
  }
  if (view.startsWith("dm:")) {
    state.chatChannel = view;
    view = "chat";
  }
  if (!VIEWS.some(([id]) => id === view)) {
    view = "feed";
  }
  state.view = view;
  history.replaceState(null, "", "#" + view);
  if (view === "chat") {
    state.unread[state.chatChannel] = 0;
  }
  renderNav();
  const renderers = {
    feed: renderFeed,
    ladder: renderLadder,
    agents: renderAgents,
    chat: renderChat,
    market: renderMarket,
    friends: renderFriends,
  };
  attempt(renderers[view]);
}

async function connectStream() {
  if (state.stream) {
    state.stream.close();
    state.stream = null;
  }
  if (!state.token) return;
  const result = await api("/api/stream/ticket", {}).catch(() => null);
  if (!result) {
    setTimeout(connectStream, 5000);
    return;
  }
  const stream = new EventSource("/api/stream?ticket=" + encodeURIComponent(result.ticket));
  stream.onmessage = event => handleEvent(JSON.parse(event.data));
  stream.onerror = () => {
    // tickets are single-use, so reconnect with a fresh one instead of letting EventSource retry
    stream.close();
    if (state.stream === stream) {
      state.stream = null;
      setTimeout(connectStream, 3000);
    }
  };
  state.stream = stream;
}

function handleEvent(event) {
  if (event.type === "notify") {
    toast(event.text);
    refreshMe();
  } else if (event.type === "chat") {
    if (state.view === "chat" && state.chatChannel === event.channel) {
      appendMessage(event.message);
    } else if (event.message.sender !== state.me.username) {
      state.unread[event.channel] = (state.unread[event.channel] || 0) + 1;
      renderNav();
      if (state.view === "chat") renderChannels();
    }
  } else if (event.type === "device" && state.view === "agents") {
    const index = state.devices.findIndex(device => device.id === event.device.id);
    if (index >= 0) {
      state.devices[index] = event.device;
      renderDeviceList();
      if (state.deviceId === event.device.id) renderDeviceInfo();
    }
  } else if (event.type === "command" && state.view === "agents" && state.deviceId === event.command.device_id) {
    loadCommands();
  } else if (event.type === "friends") {
    refreshMe();
    if (state.view === "friends") renderFriends();
  } else if (event.type === "feed" && state.view === "feed" && event.author !== state.me.username) {
    loadFeed();
  }
}

async function boot() {
  state.config = await fetch("/api/config").then(response => response.json()).catch(() => state.config);
  registerServiceWorker();
  const hash = location.hash.slice(1);
  let notice = "";
  if (hash.startsWith("auth=")) {
    setToken(decodeURIComponent(hash.slice(5)));
    history.replaceState(null, "", "/#feed");
  } else if (hash.startsWith("autherror=")) {
    state.pendingAuthError = decodeURIComponent(hash.slice(10));
    history.replaceState(null, "", "/");
  } else if (hash === "linked") {
    notice = "✅ GitHub linked - your ships can now be verified";
    history.replaceState(null, "", "/#profile");
  }
  if (!state.token) {
    return renderAuth();
  }
  workerStore(state.token);
  try {
    await refreshMe();
  } catch (error) {
    return renderAuth();
  }
  document.getElementById("topbar").hidden = false;
  connectStream();
  if (state.pendingAuthError) {
    toast("⚠ " + state.pendingAuthError);
    state.pendingAuthError = "";
  }
  if (notice) {
    toast(notice);
  }
  await handlePaymentReturn();
  const requested = location.hash.slice(1);
  if (requested === "profile") {
    return viewUser(state.me.username);
  }
  go(requested || state.view);

async function handlePaymentReturn() {
  const params = new URLSearchParams(location.search);
  const sessionId = params.get("checkout");
  const payouts = params.get("payouts");
  if (!sessionId && !payouts) return;
  history.replaceState(null, "", "/" + location.hash);
  if (sessionId) {
    const result = await attempt(() => api("/api/checkout/confirm?session_id=" + encodeURIComponent(sessionId)));
    if (result) {
      toast(result.status === "paid" ? `📦 Purchase confirmed: ${result.title}` : "Payment is still processing - we'll notify you");
    }
  }
  if (payouts) {
    const result = await attempt(() => api("/api/payouts/refresh", {}));
    if (result) {
      toast(result.payouts_enabled ? "💸 Payouts active - you can sell paid products" : "Stripe setup not finished yet");
      await refreshMe();
    }
  }
}

function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("/sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", event => {
    if (event.data && event.data.type === "open") {
      go(event.data.link || "feed");

  });
}

function urlBase64ToBytes(base64) {
  const padded = (base64 + "=".repeat((4 - base64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(padded), char => char.charCodeAt(0));
}

async function currentPushSubscription() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const registration = await navigator.serviceWorker.getRegistration();
  return registration ? registration.pushManager.getSubscription() : null;
}

async function enablePush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    return toast("This browser can't do push. On iPhone: Share → Add to Home Screen, then open the app. Or use ntfy below.");
  }
  if (!window.isSecureContext) {
    return toast("Push needs HTTPS (or localhost). Use ntfy below for phones on plain HTTP.");
  }
  const permission = await Notification.requestPermission();
  if (permission !== "granted") {
    return toast("Notifications were blocked in browser settings");
  }
  const registration = await navigator.serviceWorker.ready;
  let subscription = await registration.pushManager.getSubscription();
  if (!subscription) {
    subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToBytes(state.config.vapid_public_key),
    });
  }
  const result = await attempt(() => api("/api/push/subscribe", { endpoint: subscription.endpoint }));
  if (result) {
    toast("✅ Push enabled on this device");
    viewUser(state.me.username);
  }
}

async function disablePush() {
  const subscription = await currentPushSubscription();
  if (subscription) {
    await api("/api/push/unsubscribe", { endpoint: subscription.endpoint }).catch(() => {});
    await subscription.unsubscribe();
  }
  toast("Push disabled on this device");
  viewUser(state.me.username);
}

  if (input && !payload) {

  }
  const device = state.devices.find(item => item.id === state.deviceId);
  if (!device.online) {
    toast("Device is offline - the order will run when it reconnects");
  }
  const body = { kind, payload };
  if (kind === "agent_task" || kind === "shell") {
    const pinInput = document.getElementById("cmdpin");
    if (!pinInput || !pinInput.value) {
      return toast("Enter your command PIN");

    body.pin = pinInput.value;
  }
  const result = await attempt(() => api(`/api/devices/${state.deviceId}/commands`, body));
  if (result && input) {
    input.value = "";
  }
  loadCommands();
}

            <h3>💸 Get paid</h3>
            ${state.me.payouts_enabled
              ? `<p style="margin:0;color:var(--accent-2)">✓ Stripe payouts active - you can sell paid products.</p>`
              : `<p class="muted" style="margin:0">Connect a Stripe account to sell paid products. Takes ~3 minutes.</p>
                 <button class="primary" onclick="connectPayouts()">${state.me.stripe_connected ? "Finish Stripe setup" : "Get paid with Stripe"}</button>`}
          </div>` : ""}
        <div class="card stack">
          <h3>Sell something</h3>
          <select id="mk">${kinds.slice(1).map(kind => `<option>${kind}</option>`).join("")}</select>
          <input id="mt" placeholder="Title">
          <textarea id="md" placeholder="What does the buyer get?"></textarea>
          <input id="mp" type="number" min="0" step="0.01" placeholder="Price in USD (0 = free)">
          <input id="ml" placeholder="Delivery link (only buyers see it)">
          <button class="primary" onclick="createProduct()">List product (+100 XP per sale)</button>
        </div>
        <div class="card">
          <h3>Your orders</h3>
          <p class="muted" style="margin:0 0 8px">Revenue: <b style="color:var(--accent-2)">$${(orderData.revenue_cents / 100).toFixed(2)}</b> from ${orderData.sales.length} sale(s)${orderData.net_cents !== orderData.revenue_cents ? ` · you keep <b style="color:var(--text)">$${(orderData.net_cents / 100).toFixed(2)}</b>` : ""}</p>
          ${orderData.purchases.map(order => `<div style="margin-bottom:6px">📦 <b>${esc(order.title)}</b> <span class="muted">by ${esc(order.seller)}</span>${order.delivery_link ? ` · <a href="${esc(order.delivery_link)}" target="_blank" rel="noopener noreferrer">download</a>` : ""}</div>`).join("") || `<p class="muted">No purchases yet.</p>`}
        </div>
      </div>
      <div class="grid-cards">
        ${productData.products.map(product => `
          <div class="card product stack">
            <div class="row"><span class="kind post">${esc(product.kind)}</span><span class="grow"></span><span class="muted" style="font-size:12px">${product.sales} sold</span></div>
            <h3 style="margin:0">${esc(product.title)}</h3>
            <div class="muted">${esc(product.description)}</div>
            <div class="row">${userLink(product.seller)} ${tierBadge(product.seller_tier)}</div>
            <div class="row">
              <span class="price grow">${money(product.price_cents)}</span>
              ${product.mine ? `<span class="muted">your listing</span>`
                : product.owned ? (product.delivery_link ? `<a href="${esc(product.delivery_link)}" target="_blank" rel="noopener noreferrer">✓ Owned - open</a>` : "✓ Owned")
                : !product.seller_can_sell ? `<span class="muted" style="font-size:12px">seller setting up payouts</span>`
                : `<button class="primary small" onclick="buyProduct(${product.id}, ${product.price_cents})">${product.price_cents ? "Buy" : "Get"}</button>`}
            </div>
          </div>`).join("") || `<p class="muted">No products here yet.</p>`}
      </div>
    </div>`;
}

async function createProduct() {
  const body = {
    kind: document.getElementById("mk").value,
    title: document.getElementById("mt").value,
    description: document.getElementById("md").value,
    price: document.getElementById("mp").value || 0,
    delivery_link: document.getElementById("ml").value.trim(),
  };
  const result = await attempt(() => api("/api/products", body));
  if (result) {
    toast("Listed!");
    renderMarket();
  }
}

async function buyProduct(id, cents) {
  const demo = state.config.payments !== "stripe";
  if (cents && demo && !confirm(`Buy for ${money(cents)}? (Demo checkout - no real payment)`)) return;
  const result = await attempt(() => api(`/api/products/${id}/buy`, {}));
  if (!result) return;
  if (result.checkout_url) {
    location.href = result.checkout_url;
    return;
  }
  toast("Purchased! Find it under Your orders.");
  renderMarket();
}

async function connectPayouts() {
  const result = await attempt(() => api("/api/payouts/connect", {}));
  if (result) {
    location.href = result.url;
  }
}

// ------------------------------------------------------------ friends & profiles

async function renderFriends() {
  const data = await api("/api/friends");
  const person = (user, actions) => `
    <div class="row" style="margin-bottom:10px">
      ${avatar(user.username)}
      <div class="grow">${userLink(user.username)} ${flag(user.country)} ${tierBadge(user.tier)}
        ${user.online ? `<span class="dot on"></span>` : ""}
        <div class="muted" style="font-size:12px">${esc(user.stack || user.bio || "")}</div>
      </div>
      ${actions}
    </div>`;
  main().innerHTML = `
    <div class="grid-2">
      <div class="stack">
        <div class="card stack">
          <h3>Find builders</h3>
          <div class="row">
            <input id="fq" class="grow" placeholder="Search username">
            <button onclick="searchUsers()">Search</button>
          </div>
          <div id="fresults"></div>
        </div>
        <div class="card">
          <h3>Requests</h3>
          ${data.incoming.map(user => person(user, `<button class="primary small" onclick="friendAction('accept','${esc(user.username)}')">Accept</button>`)).join("") || `<p class="muted">No incoming requests.</p>`}
          ${data.outgoing.map(user => person(user, `<span class="muted" style="font-size:12px">pending</span>`)).join("")}
        </div>
      </div>
      <div class="card">
        <h3>Friends (${data.friends.length})</h3>
        ${data.friends.map(user => person(user, `
          <button class="small" onclick="state.chatChannel='dm:${esc(user.username)}';go('chat')">Message</button>`)).join("") || `<p class="muted">No friends yet - search for builders or add people from the ladder.</p>`}
      </div>
    </div>`;
  document.getElementById("fq").addEventListener("keydown", event => {
    if (event.key === "Enter") searchUsers();
  });
}

async function searchUsers() {
  const term = document.getElementById("fq").value.trim();
  const data = await api("/api/users?q=" + encodeURIComponent(term));
  document.getElementById("fresults").innerHTML = data.users.map(user => `
    <div class="row" style="margin-top:8px">
      ${avatar(user.username)} <span class="grow">${userLink(user.username)} ${flag(user.country)} ${tierBadge(user.tier)}</span>
      <button class="small" onclick="friendAction('request','${esc(user.username)}')">Add</button>
    </div>`).join("") || `<p class="muted">No matches.</p>`;
}

async function friendAction(action, username) {
  const result = await attempt(() => api("/api/friends/" + action, { username }));
  if (result) {
    toast(action === "remove" ? "Removed" : result.status === "accepted" ? `You and ${username} are friends! +10 XP` : "Request sent");
    await refreshMe();
    if (state.view === "friends") renderFriends();
    if (state.view === "profile") viewUser(username);
  }
}

async function viewUser(username) {
  state.view = "profile";
  renderNav();
  const data = await attempt(() => api("/api/users/" + username));
  if (!data) return;
  const user = data.user;
  const actions = {
    self: "",
    friends: `<button onclick="state.chatChannel='dm:${esc(user.username)}';go('chat')">Message</button>
              <button class="danger" onclick="friendAction('remove','${esc(user.username)}')">Unfriend</button>`,
    incoming: `<button class="primary" onclick="friendAction('accept','${esc(user.username)}')">Accept request</button>`,
    outgoing: `<button disabled>Request sent</button>`,
    none: `<button class="primary" onclick="friendAction('request','${esc(user.username)}')">Add friend</button>`,
  }[data.relation];
  const span = user.next_tier_xp ? user.next_tier_xp - user.tier_floor : 1;
  const progress = user.next_tier_xp ? ((user.xp - user.tier_floor) / span) * 100 : 100;
  main().innerHTML = `
    <div class="card stack">
      <div class="row">
        ${avatar(user.username, "lg")}
        <div class="grow">
          <h2 style="margin:0">${esc(user.username)} ${flag(user.country)} ${tierBadge(user.tier)}</h2>
          <div class="muted">${esc(user.bio || "No bio yet")}</div>
          ${user.stack ? `<div style="font-size:12px;margin-top:4px">🧰 ${esc(user.stack)}</div>` : ""}
          ${user.github_login ? `<a class="gh" href="https://github.com/${esc(user.github_login)}" target="_blank" rel="noopener noreferrer">${user.avatar_url ? `<img src="${esc(user.avatar_url)}" alt="">` : ""}github.com/${esc(user.github_login)} ✓</a>` : ""}
        </div>
        <div class="row">${actions}</div>
      </div>
      <div>
        <div class="muted" style="font-size:12px">Level ${user.level} · ${user.xp} XP ${user.next_tier ? `· ${user.next_tier_xp - user.xp} XP to ${esc(user.next_tier)}` : "· max tier"}</div>
        <div class="xpbar" style="width:100%;height:8px"><div style="width:${progress}%"></div></div>
      </div>
      <div class="grid-cards" style="grid-template-columns:repeat(5,1fr)">
        <div class="stat"><b>#${data.stats.global_rank}</b><span class="muted">global</span></div>
        <div class="stat"><b>${data.stats.ships}</b><span class="muted">ships</span></div>
        <div class="stat"><b>${data.stats.tasks_done}</b><span class="muted">agent tasks</span></div>
        <div class="stat"><b>${data.stats.sales}</b><span class="muted">sales</span></div>
        <div class="stat"><b>${data.stats.friends}</b><span class="muted">friends</span></div>
      </div>
      ${data.relation === "self" ? `
        <details>
          <summary class="muted" style="cursor:pointer">Edit profile</summary>
          <div class="stack" style="margin-top:10px">
            <input id="eb" value="${esc(user.bio)}" placeholder="Bio">
            <input id="es" value="${esc(user.stack)}" placeholder="Stack, e.g. Next.js, Claude Code, Supabase">
            <input id="ec" value="${esc(user.country)}" placeholder="Country code" maxlength="2">
            <input id="en" value="${esc(state.me.ntfy_topic || "")}" placeholder="ntfy topic for phone alerts (optional, 12+ chars, hard to guess)">
            <button class="primary" onclick="saveProfile()">Save</button>
          </div>
        </details>
        <div class="grid-2" style="grid-template-columns:1fr 1fr">
          <div class="card stack" style="background:var(--panel-2)">
            <h3>🐙 GitHub</h3>
            ${user.github_login
              ? `<p class="muted" style="margin:0">Linked as <b style="color:var(--text)">@${esc(user.github_login)}</b>. Ships with a repo you own or contribute to get ✓ verified (+50 XP). Real pushes earn +3 XP each.</p>
                 <button onclick="syncGitHub()">Sync this week's pushes</button>`
              : state.config.github
                ? `<p class="muted" style="margin:0">Link GitHub to verify ships and earn XP from real pushes.</p>
                   <button class="github" onclick="linkGitHub()">Link GitHub</button>`
                : `<p class="muted" style="margin:0">GitHub login isn't configured on this server (GITHUB_CLIENT_ID / SECRET).</p>`}
          </div>
          <div class="card stack" style="background:var(--panel-2);grid-column:1 / -1" id="securitycard">
            <h3>🛡️ Security</h3>
            <div class="grid-2" style="grid-template-columns:1fr 1fr">
              <div class="stack">
                <b>Command PIN</b>
                <span class="muted" style="font-size:12px">Needed to send agent tasks / shell to your devices. Separate from your login, so a stolen session can't run code.</span>
                ${state.me.has_command_pin ? `<input id="pincur" type="password" inputmode="numeric" placeholder="Current PIN">` : ""}
                <input id="pinnew" type="password" inputmode="numeric" placeholder="New PIN (6-12 digits)">
                <button onclick="savePin()">${state.me.has_command_pin ? "Change PIN" : "Set PIN"}</button>
              </div>
              <div class="stack">
                <b>${state.me.has_password ? "Change password" : "Set a password"}</b>
                ${state.me.has_password ? `<input id="pwcur" type="password" placeholder="Current password" autocomplete="current-password">` : `<span class="muted" style="font-size:12px">You sign in with GitHub. Setting a password requires a sign-in within the last 10 minutes.</span>`}
                <input id="pwnew" type="password" placeholder="New password (8+ chars)" autocomplete="new-password">
                <button onclick="savePassword()">Save password · signs out other devices</button>
              </div>
            </div>
            <div>
              <div class="row"><b class="grow">Signed-in devices</b><button class="small danger" onclick="revokeSessions(true)">Sign out everywhere else</button></div>
              <div id="sessionlist" class="muted" style="font-size:12px">Loading…</div>
            </div>
          </div>
          <div class="card stack" style="background:var(--panel-2)">
            <h3>📱 Phone alerts</h3>
            <p class="muted" style="margin:0">Agent finished, new sale, DMs, friend requests.</p>
            <div class="row">
              <button class="primary small" onclick="enablePush()">Enable push here</button>
              <button class="small" onclick="disablePush()">Disable</button>
              <button class="small" onclick="testPush()">Send test</button>
            </div>
            <p class="muted" style="margin:0;font-size:12px">
              iPhone: Share → Add to Home Screen first. No HTTPS? Install the free <b>ntfy</b> app,
              subscribe to a secret topic, and enter it in Edit profile.
              ${state.me.ntfy_topic ? `<br>ntfy: <b style="color:var(--text)">${esc(state.config.ntfy_base)}/${esc(state.me.ntfy_topic)}</b>` : ""}
            </p>
          </div>
        </div>` : ""}
    </div>
    <div class="grid-2" style="margin-top:18px">
      <div class="card">
        <h3>Products</h3>
        ${data.products.map(product => `<div style="margin-bottom:8px"><b>${esc(product.title)}</b> <span class="muted">${money(product.price_cents)} · ${product.sales} sold</span></div>`).join("") || `<p class="muted">Nothing for sale.</p>`}
      </div>
      <div class="card">
        <h3>Posts</h3>
        ${data.posts.map(postHtml).join("") || `<p class="muted">No posts yet.</p>`}
      </div>
    </div>`;
  if (data.relation === "self") {
    loadSessions();
  }
}

async function loadSessions() {
  const container = document.getElementById("sessionlist");
  if (!container) return;
  const data = await api("/api/security/sessions");
  container.innerHTML = data.sessions.map(session => `
    <div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)">
      <span class="grow">${session.current ? "🟢 <b>This device</b> · " : ""}${esc(session.user_agent.slice(0, 70) || "unknown device")}
        <br><span class="muted">${esc(session.ip)} · active ${ago(session.last_seen)} · signed in ${ago(session.created)}</span></span>
      ${session.current ? "" : `<button class="small danger" onclick="revokeSessions(false, '${esc(session.id)}')">Sign out</button>`}
    </div>`).join("");
}

async function revokeSessions(allOthers, id) {
  if (allOthers && !confirm("Sign out every other device?")) return;
  const result = await attempt(() => api("/api/security/sessions/revoke", allOthers ? { all_others: true } : { id }));
  if (result) {
    toast(`Signed out ${result.signed_out} session(s)`);
    loadSessions();
  }
}

async function savePin() {
  const body = { pin: document.getElementById("pinnew").value.trim() };
  const current = document.getElementById("pincur");
  if (current) {
    body.current_pin = current.value.trim();
  }
  const result = await attempt(() => api("/api/security/pin", body));
  if (result) {
    toast("🔐 Command PIN saved");
    await refreshMe();
    viewUser(state.me.username);
  }
}

async function savePassword() {
  const body = { new_password: document.getElementById("pwnew").value };
  const current = document.getElementById("pwcur");
  if (current) {
    body.current_password = current.value;
  }
  const result = await attempt(() => api("/api/security/password", body));
  if (result) {
    toast(`🔐 Password saved · ${result.signed_out_sessions} other session(s) signed out`);
    await refreshMe();
    viewUser(state.me.username);
  }
}

async function saveProfile() {
  const body = {
    bio: document.getElementById("eb").value,
    stack: document.getElementById("es").value,
    country: document.getElementById("ec").value,
    ntfy_topic: document.getElementById("en").value.trim(),
  };
  const result = await attempt(() => api("/api/profile", body));
  if (result) {
    toast("Profile saved");
    await refreshMe();
    viewUser(state.me.username);
  }
}

boot();
</script>
</body>
</html>
